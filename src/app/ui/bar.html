<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:">
  <meta name="color-scheme" content="light dark">
  <title>CalHack</title>
  <link rel="stylesheet" href="bar.css">
</head>
<body>
  <!-- The window is transparent. The card sits at the bottom and grows upward. -->
  <div class="stage" id="stage">
    <section class="card is-hidden" id="card" role="dialog" aria-label="CalHack helper" tabindex="-1">
      <div class="grip" aria-hidden="true"></div>
      <header class="head" id="head" title="Drag to move. Double-click to put it back.">
        <div class="head-text">
          <div class="eyebrow" id="eyebrow"></div>
          <h1 class="title" id="title"></h1>
        </div>
        <div class="head-btns">
          <button class="icon-btn" id="size" type="button" aria-expanded="true" aria-label="Make smaller" title="Make smaller"></button>
          <button class="icon-btn" id="mute" type="button" aria-pressed="false" aria-label="Turn voice off" title="Turn voice off"></button>
          <button class="icon-btn" id="close" type="button" aria-label="Close" title="Close" hidden></button>
        </div>
      </header>
      <div class="body" id="body"></div>
      <div class="details" id="details" hidden></div>
      <div class="now" id="now" hidden>
        <span class="now-caret" aria-hidden="true">›</span>
        <span class="now-text" id="now-text" aria-live="polite"></span>
        <button class="now-toggle" id="details-toggle" type="button" aria-expanded="false" aria-controls="details" hidden></button>
      </div>
      <div class="actions" id="actions"></div>
      <div class="caption" id="caption" hidden>
        <span class="caption-icon" id="caption-icon" aria-hidden="true"></span>
        <span class="caption-text" id="caption-text" aria-live="polite"></span>
      </div>
    </section>
  </div>
  <script src="mic.js"></script>
  <script src="bar.js"></script>
</body>
</html>
